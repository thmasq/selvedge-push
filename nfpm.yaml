name: selvedge-push
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: "Thomas Q <thomasqsa@gmail.com>"
description: Stateless Matrix Web Push Gateway for Selvedge
homepage: https://github.com/${GITHUB_REPOSITORY}
license: "AGPL-3.0-only"

depends:
  - ca-certificates

contents:
  - src: ${BINARY_PATH}
    dst: /usr/bin/selvedge-push
    file_info:
      owner: root
      group: root
      mode: 0755

  - src: .env.example
    dst: /etc/selvedge-push.env
    type: config|noreplace
    file_info:
      owner: root
      group: root
      mode: 0600

  - src: selvedge-push.service
    dst: /usr/lib/systemd/system/selvedge-push.service
    packager: rpm
    file_info:
      owner: root
      group: root
      mode: 0644

  - src: selvedge-push.service
    dst: /lib/systemd/system/selvedge-push.service
    packager: deb
    file_info:
      owner: root
      group: root
      mode: 0644

  - src: packaging/selvedge-push.initd
    dst: /etc/init.d/selvedge-push
    packager: apk
    file_info:
      owner: root
      group: root
      mode: 0755

overrides:
  rpm:
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh
  deb:
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh
  apk:
    scripts:
      preinstall: packaging/alpine-preinstall.sh
      preremove: packaging/alpine-preremove.sh
      postupgrade: packaging/alpine-postupgrade.sh
