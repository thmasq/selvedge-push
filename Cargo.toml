[package]
name = "selvedge-push"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/thmasq/selvedge-push"
description = "Stateless Matrix Web Push Gateway for Selvedge"

[dependencies]
axum = "0.8.9"
# Async runtime & HTTP server
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "timeout", "trace"] }

# Outbound Web Push HTTP client
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }

# Web Push crypto (RFC 8291 aes128gcm & RFC 8292 VAPID ES256)
aes-gcm = "0.11.1"
getrandom = "0.4.3"
hkdf = "0.13"
p256 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
sha2 = "0.11.1"
zeroize = { version = "1.9.2", features = ["derive"] }

# Low-contention in-memory heartbeat store
dashmap = "6.2.1"

# Serialization, encoding, URL parsing
base64 = "0.23.1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.9"

# Errors & logging
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
strip = "symbols"
panic = "abort"
